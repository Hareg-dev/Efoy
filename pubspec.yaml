name: efoy_retail_app
description: "Efoy - Ethiopian Retail POS & Inventory Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Amharic + English Material/Widgets/Cupertino strings
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Offline licensing domain (payload codec + Ed25519 verification)
  efoy_licensing:
    path: packages/efoy_licensing

  # Local Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3
  
  # Barcode Scanning (Camera removed - will add when needed)
  mobile_scanner: ^5.1.1
  permission_handler: ^11.3.1
  
  # UI & Icons
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  cupertino_icons: ^1.0.8
  
  # Networking & Sync
  web_socket_channel: ^3.0.0
  network_info_plus: ^6.0.0
  
  # Security & Device Info
  crypto: ^3.0.3
  device_info_plus: ^10.1.2
  flutter_secure_storage: ^9.2.2

  # Merchant profile photo
  image_picker: ^1.2.4

  # Reports: Excel export + handing the file to the user.
  # Pinned to 12.x: share_plus >=13 needs win32 ^6, which conflicts with the
  # win32 <6 ceiling pulled in by device_info_plus 10.1.2.
  excel: ^4.0.6
  share_plus: ^12.0.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.4
  # Signing support for license test fixtures only. The distributed app never
  # signs anything.
  cryptography: ^2.7.0

flutter_launcher_icons:
  # Legacy icons use the brand mark on white; the full lockup with the
  # "Finally, business made easy" tagline is illegible at 48px.
  image_path: "assets/icon_src/efoy_mark_square.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_android: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_src/efoy_mark_foreground.png"

flutter:
  uses-material-design: true
  
  assets:
    - asset/efoy.jpg
    - assets/icons/
    - assets/i18n/
