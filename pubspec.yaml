name: efoy_retail_app
description: "Efoy - Ethiopian Retail POS & Inventory Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Local Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3
  
  # Barcode Scanning (Camera removed - will add when needed)
  mobile_scanner: ^5.1.1
  permission_handler: ^11.3.1
  
  # UI & Icons
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  cupertino_icons: ^1.0.8
  
  # Networking & Sync
  web_socket_channel: ^3.0.0
  network_info_plus: ^6.0.0
  
  # Security & Device Info
  crypto: ^3.0.3
  device_info_plus: ^10.1.2
  flutter_secure_storage: ^9.2.2
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  
  assets:
    - asset/efoy.jpg
    - assets/icons/
    - assets/i18n/
